<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Job Hunt — настройки</title>
<style>
  :root { color-scheme: light dark; --bg: #11161f; --panel: #192231; --line: #2a3446; --text: #e6ebf3;
          --muted: #8e9bb0; --accent: #326fd1; --warn: #f4b15f; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fa; --panel: #fff; --line: #dce3ed; --text: #172033; --muted: #68758a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 22px 28px; background: var(--bg); color: var(--text);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 6px; margin: 0 0 14px;
             background: var(--panel); }
  legend { padding: 0 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
  label span small { display: block; color: var(--muted); font-size: 12px; }
  input[type=number], input[type=time] { width: 92px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line);
             background: var(--bg); color: var(--text); font: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .warn { border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 12px; }
  #saved { color: var(--muted); align-self: center; }
</style>
</head>
<body>
<h1>Настройки</h1>

<div class="warn" id="toastwarn" hidden>
  Уведомления Windows выключены — Job Hunt не сможет показать новые вакансии.
  <div class="row"><button id="opennotif">Открыть настройки уведомлений</button></div>
</div>

<form id="form">
  <fieldset>
    <legend>Запуск</legend>
    <label><span>Запускать вместе с Windows<small>сразу в трей, без окна</small></span><input type="checkbox" name="autostart"></label>
  </fieldset>

  <fieldset>
    <legend>Поиск в фоне</legend>
    <label><span>Обновлять площадки каждые, ч<small>NoFluffJobs, JustJoin, Indeed, Himalayas</small></span><input type="number" name="refreshHours" min="1" max="48" step="1"></label>
    <label><span>LinkedIn раз в день<small>только новое, по одному запросу</small></span><input type="checkbox" name="linkedinBackground"></label>
  </fieldset>

  <fieldset>
    <legend>Уведомления</legend>
    <label><span>Сразу, когда появились новые вакансии</span><input type="checkbox" name="notifyNew"></label>
    <label><span>Не раньше, чем наберётся</span><input type="number" name="notifyMin" min="1" max="50" step="1"></label>
    <label><span>Тихие часы с</span><input type="time" name="quietFrom"></label>
    <label><span>до</span><input type="time" name="quietTo"></label>
    <label><span>Сводка за сутки<small>«За сутки появилось N новых вакансий»</small></span><input type="checkbox" name="digest"></label>
    <label><span>в</span><input type="time" name="digestTime"></label>
    <div class="row"><button type="button" id="test">Проверить уведомление</button></div>
  </fieldset>

  <fieldset>
    <legend>Сеть</legend>
    <label><span>Порт</span><input type="number" name="port" min="1024" max="65535"></label>
    <label><span>Доступ с телефона в той же Wi-Fi<small>без пароля — только для доверенной сети</small></span><input type="checkbox" name="lanAccess"></label>
  </fieldset>

  <div class="row">
    <button type="submit" class="primary">Сохранить</button>
    <button type="button" id="log">Открыть лог</button>
    <span id="saved"></span>
  </div>
  <p class="muted" id="repo"></p>
</form>

<script>
  const form = document.getElementById("form");
  const fields = [...form.querySelectorAll("input[name]")];

  async function load() {
    const { settings, toastsOff, repo } = await window.jobHunt.get();
    for (const input of fields) {
      if (input.type === "checkbox") input.checked = Boolean(settings[input.name]);
      else input.value = settings[input.name];
    }
    document.getElementById("toastwarn").hidden = !toastsOff;
    document.getElementById("repo").textContent = "Проект: " + repo;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const next = {};
    for (const input of fields) {
      next[input.name] = input.type === "checkbox" ? input.checked : input.type === "number" ? Number(input.value) : input.value;
    }
    document.getElementById("saved").textContent = "Сохраняю…";
    await window.jobHunt.save(next);
    document.getElementById("saved").textContent = "Сохранено";
  });
  document.getElementById("opennotif").addEventListener("click", () => window.jobHunt.openNotificationSettings());
  document.getElementById("test").addEventListener("click", () => window.jobHunt.testNotification());
  document.getElementById("log").addEventListener("click", () => window.jobHunt.openLog());
  load();
</script>
</body>
</html>
